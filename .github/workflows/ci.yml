name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: checkpoint
          POSTGRES_PASSWORD: checkpoint
          POSTGRES_DB: checkpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://checkpoint:checkpoint@localhost:5432/checkpoint
      JWT_SECRET: ci-only-secret-not-for-production
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test
